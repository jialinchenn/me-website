<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME</title>
    <style>
        :root {
            --bg: #fff;
            --text-main: #050505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none;
        }

        #cursor-cross {
            position: fixed;
            top: 0;
            left: 0;
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-8px, -8px);
        }

        #cursor-cross::before,
        #cursor-cross::after {
            content: '';
            position: absolute;
            background: var(--text-main);
        }

        #cursor-cross::before {
            width: 100%;
            height: 2px;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }

        #cursor-cross::after {
            width: 2px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Go Back Button */
        .back-btn {
            position: absolute;
            top: 40px;
            left: 40px;
            font-family: monospace;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-main);
            font-size: 14px;
            letter-spacing: 0.1em;
            z-index: 50;
            padding: 8px 16px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .back-btn:hover {
            border-color: var(--text-main);
        }

        /* Container for the canvas */
        .image-container {
            position: relative;
            width: 26.6vw;
            /* ~1/3 of 80vw */
            max-width: 200px;
            /* ~1/3 of 600px */
            aspect-ratio: 1;
            /* assuming squareish portrait */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            max-width: 100%;
            max-height: 80vh;
            display: block;
            opacity: 0;
            /* hidden until js takes over */
            transition: opacity 0.1s;
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-btn">
        < BACK</a>

            <div class="image-container">
                <canvas id="scramble-canvas"></canvas>
            </div>

            <!-- Hidden image source for the canvas to draw from -->
            <img id="source-image" src="photo.jpg" alt="Jialin Chen" style="display: none;" crossorigin="anonymous">

    <div id="cursor-cross"></div>
    <script>
        document.addEventListener('mousemove', (e) => {
            const c = document.getElementById('cursor-cross');
            c.style.left = e.clientX + 'px';
            c.style.top = e.clientY + 'px';
        });
    </script>

            <script>
                class ImageScramble {
                    constructor(canvas, imageElement) {
                        this.canvas = canvas;
                        this.ctx = canvas.getContext('2d');
                        this.image = imageElement;

                        // Grid resolution (columns and rows to split the image into)
                        this.cols = 32;
                        this.rows = 32;

                        // Colors to fill the "scrambled" empty blocks with to match the text glitch feel
                        this.scrambleColors = ['#f0f0f0', '#e0e0e0', '#d0d0d0', '#bfbfbf', '#050505'];

                        this.update = this.update.bind(this);

                        // We will start the animation when the image loads
                        if (this.image.complete) {
                            this.init();
                        } else {
                            this.image.onload = () => this.init();
                        }
                    }

                    init() {
                        // Set canvas size to match image intrinsic dimensions for sharp rendering
                        this.canvas.width = this.image.naturalWidth;
                        this.canvas.height = this.image.naturalHeight;
                        this.canvas.style.opacity = 0; // start transparent, fade in during animation
                        this.totalDuration = 1300;

                        this.blockWidth = this.canvas.width / this.cols;
                        this.blockHeight = this.canvas.height / this.rows;

                        this.blocks = [];
                        const totalDuration = this.totalDuration;

                        // Create a block definition for every grid cell
                        for (let y = 0; y < this.rows; y++) {
                            for (let x = 0; x < this.cols; x++) {

                                // Scramble logic limits: each block locks into its true image slice between 700ms and 1400ms
                                const start = Math.floor(Math.random() * (totalDuration / 2));
                                const end = start + Math.floor(Math.random() * (totalDuration / 2)) + (totalDuration / 2);

                                this.blocks.push({
                                    x: x,
                                    y: y,
                                    start: start,
                                    end: end,
                                    isResolved: false
                                });
                            }
                        }

                        // Initial short delay (100ms) to match the text scramble start delay
                        setTimeout(() => {
                            this.startTime = Date.now();
                            this.update();
                        }, 100);
                    }

                    update() {
                        let completeCount = 0;
                        const timePassed = Date.now() - this.startTime;

                        // Fade canvas opacity from 0 -> 1 over the full animation duration
                        const progress = Math.min(timePassed / this.totalDuration, 1);
                        this.canvas.style.opacity = progress;

                        // Clear entire canvas to background color for this frame
                        this.ctx.fillStyle = '#fff';
                        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                        for (let i = 0; i < this.blocks.length; i++) {
                            const block = this.blocks[i];

                            const dx = block.x * this.blockWidth;
                            const dy = block.y * this.blockHeight;

                            if (timePassed >= block.end) {
                                // Block is fully resolved: draw the correct piece of the original image
                                block.isResolved = true;
                                completeCount++;
                                this.ctx.drawImage(
                                    this.image,
                                    dx, dy, this.blockWidth, this.blockHeight, // Source coords
                                    dx, dy, this.blockWidth, this.blockHeight  // Dest coords
                                );
                            } else if (timePassed >= block.start) {
                                // Block is actively "scrambling"
                                // Draw a solid color block to simulate noise/character replacement without revealing the image
                                this.ctx.fillStyle = this.scrambleColors[Math.floor(Math.random() * this.scrambleColors.length)];
                                this.ctx.fillRect(dx, dy, this.blockWidth, this.blockHeight);
                            } else {
                                // Before block start time: leave it blank (white) or draw an initial noise color
                                if (Math.random() < 0.05) {
                                    this.ctx.fillStyle = '#f0f0f0';
                                    this.ctx.fillRect(dx, dy, this.blockWidth, this.blockHeight);
                                }
                            }
                        }

                        if (completeCount === this.blocks.length) {
                            // Animation is completely finished
                            // Do one final draw of the whole image to ensure no microscopic grid seams are visible
                            this.ctx.drawImage(this.image, 0, 0, this.canvas.width, this.canvas.height);
                        } else {
                            requestAnimationFrame(this.update);
                        }
                    }
                }

                function initURLCleanup() {
                    if (window.location.protocol !== 'file:' && window.location.pathname.endsWith('.html')) {
                        const newPath = window.location.pathname.replace(/\.html$/, '');
                        window.history.replaceState(null, '', newPath + window.location.search + window.location.hash);
                    }
                }

                document.addEventListener("DOMContentLoaded", () => {
                    initURLCleanup();
                    const canvasEl = document.getElementById('scramble-canvas');
                    const imgEl = document.getElementById('source-image');
                    new ImageScramble(canvasEl, imgEl);
                });
            </script>
</body>

</html>
