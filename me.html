<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>come back later</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fff;
            --text-main: #000;
            --text-dim: #000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Raleway', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .back-btn {
            position: absolute;
            top: 40px;
            left: 40px;
            font-family: monospace;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-main);
            font-size: 14px;
            letter-spacing: 0.1em;
            z-index: 50;
            padding: 8px 16px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .back-btn:hover {
            border-color: var(--text-main);
        }

        .content {
            text-align: center;
            font-size: 12.6px;
            /* 18px * 0.7 */
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-main);
            font-weight: 500;
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-btn">
        < BACK</a>

            <div class="content" id="scramble-content">
                don't look yet.
            </div>

            <script>
                class TextScramble {
                    constructor(el) {
                        this.el = el;
                        this.chars = '!<>-_\\\\/[]{}—=+*^?#________';
                        this.update = this.update.bind(this);
                    }

                    setText(newText) {
                        const oldText = this.el.innerText;
                        const length = Math.max(oldText.length, newText.length);
                        const promise = new Promise((resolve) => this.resolve = resolve);
                        this.queue = [];
                        const totalDuration = 1300;

                        for (let i = 0; i < length; i++) {
                            const from = oldText[i] || '';
                            const to = newText[i] || '';
                            const start = Math.floor(Math.random() * (totalDuration / 2));
                            const end = start + Math.floor(Math.random() * (totalDuration / 2)) + (totalDuration / 2);
                            this.queue.push({ from, to, start, end });
                        }

                        cancelAnimationFrame(this.frameRequest);
                        this.startTime = Date.now();
                        this.update();
                        return promise;
                    }

                    update() {
                        let output = '';
                        let complete = 0;
                        const timePassed = Date.now() - this.startTime;

                        for (let i = 0, n = this.queue.length; i < n; i++) {
                            let { from, to, start, end, char } = this.queue[i];

                            if (timePassed >= end) {
                                complete++;
                                output += to;
                            } else if (timePassed >= start) {
                                if (!char || Math.random() < 0.28) {
                                    char = this.randomChar();
                                    this.queue[i].char = char;
                                }
                                output += char;
                            } else {
                                output += from;
                            }
                        }
                        this.el.innerText = output;

                        if (complete === this.queue.length) {
                            this.resolve();
                        } else {
                            this.frameRequest = requestAnimationFrame(this.update);
                        }
                    }

                    randomChar() {
                        return this.chars[Math.floor(Math.random() * this.chars.length)];
                    }
                }

                function initURLCleanup() {
                    if (window.location.protocol !== 'file:' && window.location.pathname.endsWith('.html')) {
                        const newPath = window.location.pathname.replace(/\.html$/, '');
                        window.history.replaceState(null, '', newPath + window.location.search + window.location.hash);
                    }
                }

                document.addEventListener("DOMContentLoaded", () => {
                    initURLCleanup();
                    const el = document.getElementById('scramble-content');
                    const fx = new TextScramble(el);
                    el.innerText = '';
                    setTimeout(() => {
                        fx.setText('building something great...');
                    }, 100);
                });
            </script>
</body>

</html>
